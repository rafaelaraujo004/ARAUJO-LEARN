<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f2d6b"/>
      <stop offset="100%" stop-color="#091a3e"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#e6a84f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- === SCALES OF JUSTICE (large, detailed) === -->
  <g transform="translate(580, 100)">
    <!-- Central pillar -->
    <rect x="-4" y="20" width="8" height="200" rx="2" fill="#c8832c" opacity="0.5"/>
    <!-- Base -->
    <rect x="-50" y="218" width="100" height="12" rx="4" fill="#c8832c" opacity="0.4"/>
    <rect x="-35" y="212" width="70" height="10" rx="3" fill="#c8832c" opacity="0.35"/>

    <!-- Beam (slightly tilted to show weighing) -->
    <g transform="rotate(-5, 0, 25)">
      <rect x="-110" y="22" width="220" height="6" rx="3" fill="#e6a84f" opacity="0.6"/>

      <!-- Fulcrum ornament -->
      <circle cx="0" cy="20" r="10" fill="#c8832c" opacity="0.5"/>
      <circle cx="0" cy="20" r="5" fill="#e6a84f" opacity="0.4"/>

      <!-- Left chain + pan (law book side - heavier, lower) -->
      <g transform="translate(-100, 0)">
        <line x1="0" y1="28" x2="0" y2="85" stroke="#c8832c" stroke-width="1.5" opacity="0.4"/>
        <line x1="-25" y1="28" x2="-25" y2="78" stroke="#c8832c" stroke-width="1" opacity="0.3"/>
        <line x1="25" y1="28" x2="25" y2="78" stroke="#c8832c" stroke-width="1" opacity="0.3"/>
        <!-- Pan -->
        <ellipse cx="0" cy="88" rx="40" ry="10" fill="#c8832c" opacity="0.3"/>
        <path d="M -40 85 Q -40 95 0 98 Q 40 95 40 85" fill="#c8832c" opacity="0.2"/>

        <!-- LAW BOOK on pan -->
        <g transform="translate(-20, 55)">
          <rect x="0" y="0" width="40" height="28" rx="2" fill="#8b1a1a" opacity="0.7"/>
          <rect x="2" y="2" width="36" height="24" rx="1" fill="#a02020" opacity="0.6"/>
          <!-- Book spine lines -->
          <line x1="5" y1="5" x2="5" y2="23" stroke="#fff" stroke-width="0.5" opacity="0.2"/>
          <!-- Paragraph symbol on book -->
          <text x="20" y="19" fill="#e6a84f" text-anchor="middle" font-family="serif" font-size="14" font-weight="700" opacity="0.6">§</text>
        </g>
      </g>

      <!-- Right chain + pan (hammer side - lighter, higher) -->
      <g transform="translate(100, 0)">
        <line x1="0" y1="28" x2="0" y2="70" stroke="#c8832c" stroke-width="1.5" opacity="0.4"/>
        <line x1="-25" y1="28" x2="-25" y2="63" stroke="#c8832c" stroke-width="1" opacity="0.3"/>
        <line x1="25" y1="28" x2="25" y2="63" stroke="#c8832c" stroke-width="1" opacity="0.3"/>
        <!-- Pan -->
        <ellipse cx="0" cy="73" rx="40" ry="10" fill="#c8832c" opacity="0.3"/>
        <path d="M -40 70 Q -40 80 0 83 Q 40 80 40 70" fill="#c8832c" opacity="0.2"/>

        <!-- GAVEL on pan -->
        <g transform="translate(-12, 45)">
          <!-- Handle -->
          <rect x="8" y="8" width="28" height="5" rx="2" fill="#8b6914" opacity="0.6" transform="rotate(-30, 22, 10)"/>
          <!-- Head -->
          <rect x="0" y="0" width="14" height="10" rx="3" fill="#a07828" opacity="0.7"/>
        </g>
      </g>
    </g>
  </g>

  <!-- === OPEN LAW BOOK (on desk) === -->
  <g transform="translate(440, 310)">
    <!-- Left page -->
    <path d="M 0 0 Q -5 -5 -80 -8 L -80 80 Q -5 77 0 82 Z" fill="#f0ebe3" opacity="0.7"/>
    <!-- Right page -->
    <path d="M 0 0 Q 5 -5 80 -8 L 80 80 Q 5 77 0 82 Z" fill="#ede6da" opacity="0.7"/>
    <!-- Spine shadow -->
    <line x1="0" y1="0" x2="0" y2="82" stroke="#000" stroke-width="2" opacity="0.1"/>
    <!-- Text lines on left page -->
    <g opacity="0.25" fill="#333">
      <rect x="-70" y="8" width="55" height="2" rx="1"/>
      <rect x="-70" y="16" width="60" height="2" rx="1"/>
      <rect x="-70" y="24" width="45" height="2" rx="1"/>
      <rect x="-70" y="32" width="58" height="2" rx="1"/>
      <rect x="-70" y="40" width="50" height="2" rx="1"/>
      <rect x="-70" y="48" width="55" height="2" rx="1"/>
      <rect x="-70" y="56" width="40" height="2" rx="1"/>
    </g>
    <!-- Text lines on right page -->
    <g opacity="0.25" fill="#333">
      <rect x="10" y="8" width="55" height="2" rx="1"/>
      <rect x="10" y="16" width="60" height="2" rx="1"/>
      <rect x="10" y="24" width="48" height="2" rx="1"/>
      <rect x="10" y="32" width="55" height="2" rx="1"/>
      <rect x="10" y="40" width="42" height="2" rx="1"/>
      <rect x="10" y="48" width="58" height="2" rx="1"/>
      <rect x="10" y="56" width="35" height="2" rx="1"/>
    </g>
    <!-- Article highlight -->
    <rect x="-72" y="6" width="5" height="2" rx="1" fill="#c8832c" opacity="0.5"/>
    <rect x="65" y="30" width="5" height="2" rx="1" fill="#c8832c" opacity="0.5"/>
  </g>

  <!-- === CREA BADGE === -->
  <g transform="translate(700, 90)">
    <!-- Shield shape -->
    <path d="M 0 -35 L 30 -20 L 30 15 Q 30 40 0 50 Q -30 40 -30 15 L -30 -20 Z" fill="#c8832c" stroke="#e6a84f" stroke-width="1.5" opacity="0.35"/>
    <!-- Inner shield -->
    <path d="M 0 -25 L 22 -13 L 22 10 Q 22 30 0 38 Q -22 30 -22 10 L -22 -13 Z" fill="#0c2456" opacity="0.5"/>
    <!-- CREA text -->
    <text x="0" y="5" fill="#e6a84f" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em" opacity="0.7">CREA</text>
    <!-- Star -->
    <polygon points="0,-18 2,-12 8,-12 3,-8 5,-2 0,-6 -5,-2 -3,-8 -8,-12 -2,-12" fill="#e6a84f" opacity="0.4"/>
  </g>

  <!-- === PERSON (studying law, with glasses) === -->
  <g transform="translate(480, 75)">
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#d4a06a" opacity="0.85"/>
    <!-- Hair -->
    <path d="M -20 -3 Q -20 -22 0 -24 Q 20 -22 20 -3" fill="#1a1a1a" opacity="0.6"/>
    <!-- Hard hat (white for engineering context) -->
    <path d="M -24 -6 Q -24 -28 0 -28 Q 24 -28 24 -6 L 26 -4 L -26 -4 Z" fill="#ddd" opacity="0.6"/>
    <rect x="-26" y="-6" width="52" height="4" rx="2" fill="#bbb" opacity="0.5"/>
    <!-- Glasses -->
    <circle cx="-7" cy="1" r="6" fill="none" stroke="#888" stroke-width="1.2" opacity="0.5"/>
    <circle cx="7" cy="1" r="6" fill="none" stroke="#888" stroke-width="1.2" opacity="0.5"/>
    <line x1="-1" y1="1" x2="1" y2="1" stroke="#888" stroke-width="1" opacity="0.5"/>
    <!-- Eyes through glasses -->
    <circle cx="-7" cy="2" r="1.5" fill="#222" opacity="0.5"/>
    <circle cx="7" cy="2" r="1.5" fill="#222" opacity="0.5"/>
  </g>

  <!-- === DOCUMENT / ART === -->
  <g transform="translate(690, 260) rotate(5)">
    <rect x="0" y="0" width="60" height="80" rx="3" fill="#f0ebe3" opacity="0.5"/>
    <rect x="6" y="6" width="48" height="8" rx="1" fill="#0c2456" opacity="0.2"/>
    <g opacity="0.15" fill="#333">
      <rect x="6" y="20" width="40" height="2" rx="1"/>
      <rect x="6" y="26" width="44" height="2" rx="1"/>
      <rect x="6" y="32" width="36" height="2" rx="1"/>
      <rect x="6" y="38" width="42" height="2" rx="1"/>
      <rect x="6" y="44" width="38" height="2" rx="1"/>
    </g>
    <!-- Stamp -->
    <circle cx="40" cy="62" r="10" fill="none" stroke="#c8832c" stroke-width="1.5" opacity="0.4"/>
    <text x="40" y="65" fill="#c8832c" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="6" font-weight="700" opacity="0.4">ART</text>
  </g>

  <!-- === BONUS BADGE === -->
  <g transform="translate(720, 400)">
    <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#c8832c" opacity="0.7"/>
    <text x="0" y="4" fill="#fff" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">BÔNUS</text>
  </g>

  <!-- === TEXT === -->
  <rect x="50" y="375" width="100" height="3" rx="1.5" fill="url(#gold3)"/>
  <text x="50" y="345" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">ENGENHARIA CIVIL</text>

  <text fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="50" y="145">Legislação de</tspan>
    <tspan x="50" dy="44">Obra e Sistema</tspan>
    <tspan x="50" dy="44">CREA</tspan>
  </text>

  <circle cx="600" cy="200" r="180" fill="#e6a84f" opacity="0.03"/>
</svg>
