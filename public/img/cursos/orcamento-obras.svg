<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f2d6b"/>
      <stop offset="100%" stop-color="#091a3e"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#e6a84f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- === CLIPBOARD === -->
  <g transform="translate(430, 55)">
    <rect x="0" y="20" width="250" height="320" rx="8" fill="#1e3f6f" stroke="#2a5a9e" stroke-width="1.5"/>
    <!-- Clip -->
    <rect x="90" y="8" width="70" height="24" rx="6" fill="#8899aa" opacity="0.7"/>
    <rect x="95" y="14" width="60" height="14" rx="4" fill="#1e3f6f"/>
    <!-- Paper -->
    <rect x="15" y="45" width="220" height="280" rx="3" fill="#f0ebe3" opacity="0.92"/>

    <!-- Table header -->
    <rect x="20" y="50" width="210" height="22" rx="2" fill="#0c2456" opacity="0.8"/>
    <text x="35" y="65" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600">ITEM</text>
    <text x="100" y="65" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600">SERVIÇO</text>
    <text x="195" y="65" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="600">VALOR</text>

    <!-- Table rows -->
    <g font-family="monospace" font-size="8" fill="#333" opacity="0.7">
      <text x="35" y="85">01</text><text x="75" y="85">Fundação</text><text x="185" y="85">R$ 42.500</text>
      <line x1="20" y1="90" x2="230" y2="90" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="103">02</text><text x="75" y="103">Estrutura</text><text x="185" y="103">R$ 68.000</text>
      <line x1="20" y1="108" x2="230" y2="108" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="121">03</text><text x="75" y="121">Alvenaria</text><text x="185" y="121">R$ 31.200</text>
      <line x1="20" y1="126" x2="230" y2="126" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="139">04</text><text x="75" y="139">Inst. elétricas</text><text x="185" y="139">R$ 18.900</text>
      <line x1="20" y1="144" x2="230" y2="144" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="157">05</text><text x="75" y="157">Inst. hidráulicas</text><text x="185" y="157">R$ 14.300</text>
      <line x1="20" y1="162" x2="230" y2="162" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="175">06</text><text x="75" y="175">Acabamento</text><text x="185" y="175">R$ 52.800</text>
      <line x1="20" y1="180" x2="230" y2="180" stroke="#ccc" stroke-width="0.5"/>
      <text x="35" y="193">07</text><text x="75" y="193">Pintura</text><text x="185" y="193">R$ 12.400</text>
    </g>

    <!-- Total -->
    <rect x="20" y="200" width="210" height="24" rx="2" fill="#c8832c" opacity="0.15"/>
    <text x="75" y="216" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700">TOTAL</text>
    <text x="178" y="216" fill="#c8832c" font-family="monospace" font-size="10" font-weight="700">R$ 240.100</text>

    <!-- Mini bar chart -->
    <g transform="translate(30, 235)">
      <rect x="0" y="60" width="24" height="40" rx="2" fill="#0c2456" opacity="0.25"/>
      <rect x="30" y="30" width="24" height="70" rx="2" fill="#0c2456" opacity="0.35"/>
      <rect x="60" y="50" width="24" height="50" rx="2" fill="#0c2456" opacity="0.25"/>
      <rect x="90" y="45" width="24" height="55" rx="2" fill="#0c2456" opacity="0.3"/>
      <rect x="120" y="65" width="24" height="35" rx="2" fill="#0c2456" opacity="0.2"/>
      <rect x="150" y="20" width="24" height="80" rx="2" fill="#c8832c" opacity="0.5"/>
      <rect x="180" y="55" width="24" height="45" rx="2" fill="#0c2456" opacity="0.25"/>
    </g>
  </g>

  <!-- === CALCULATOR === -->
  <g transform="translate(395, 285) rotate(-8)">
    <rect x="0" y="0" width="65" height="90" rx="5" fill="#222" opacity="0.7"/>
    <rect x="5" y="7" width="55" height="18" rx="3" fill="#2a5" opacity="0.3"/>
    <text x="52" y="21" fill="#4ade80" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" opacity="0.8">240.100</text>
    <g fill="#444" opacity="0.5">
      <rect x="5" y="30" width="11" height="9" rx="2"/><rect x="19" y="30" width="11" height="9" rx="2"/>
      <rect x="33" y="30" width="11" height="9" rx="2"/><rect x="47" y="30" width="11" height="9" rx="2" fill="#c8832c" opacity="0.6"/>
      <rect x="5" y="42" width="11" height="9" rx="2"/><rect x="19" y="42" width="11" height="9" rx="2"/>
      <rect x="33" y="42" width="11" height="9" rx="2"/><rect x="47" y="42" width="11" height="9" rx="2" fill="#c8832c" opacity="0.6"/>
      <rect x="5" y="54" width="11" height="9" rx="2"/><rect x="19" y="54" width="11" height="9" rx="2"/>
      <rect x="33" y="54" width="11" height="9" rx="2"/><rect x="47" y="54" width="11" height="9" rx="2" fill="#c8832c" opacity="0.6"/>
      <rect x="5" y="66" width="25" height="9" rx="2"/><rect x="33" y="66" width="11" height="9" rx="2"/>
      <rect x="47" y="66" width="11" height="16" rx="2" fill="#c8832c" opacity="0.7"/>
    </g>
  </g>

  <!-- === COIN STACKS === -->
  <g transform="translate(700, 345)">
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="#c8832c" opacity="0.3"/>
    <ellipse cx="0" cy="-5" rx="20" ry="7" fill="#c8832c" opacity="0.35"/>
    <ellipse cx="0" cy="-10" rx="20" ry="7" fill="#c8832c" opacity="0.4"/>
    <ellipse cx="0" cy="-15" rx="20" ry="7" fill="#c8832c" opacity="0.45"/>
    <ellipse cx="0" cy="-20" rx="20" ry="7" fill="#e6a84f" opacity="0.5"/>
    <text x="0" y="-16" fill="#fff" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="700" opacity="0.5">R$</text>
  </g>
  <g transform="translate(660, 365)">
    <ellipse cx="0" cy="0" rx="18" ry="6" fill="#c8832c" opacity="0.25"/>
    <ellipse cx="0" cy="-5" rx="18" ry="6" fill="#c8832c" opacity="0.3"/>
    <ellipse cx="0" cy="-10" rx="18" ry="6" fill="#e6a84f" opacity="0.35"/>
  </g>

  <!-- === PERSON (reviewing budget) === -->
  <g transform="translate(500, 60)">
    <circle cx="0" cy="0" r="20" fill="#d4a06a" opacity="0.85"/>
    <path d="M -20 -3 Q -20 -22 0 -22 Q 20 -22 20 -3" fill="#2a1a0a" opacity="0.7"/>
    <!-- Hard hat yellow -->
    <path d="M -24 -6 Q -24 -28 0 -28 Q 24 -28 24 -6 L 26 -4 L -26 -4 Z" fill="#e6a84f" opacity="0.85"/>
    <rect x="-26" y="-6" width="52" height="4" rx="2" fill="#c8832c" opacity="0.8"/>
    <circle cx="-6" cy="2" r="2" fill="#222" opacity="0.5"/>
    <circle cx="6" cy="2" r="2" fill="#222" opacity="0.5"/>
  </g>

  <!-- === PEN (on desk) === -->
  <g transform="translate(660, 300) rotate(20)">
    <rect x="0" y="0" width="60" height="5" rx="1" fill="#333" opacity="0.5"/>
    <polygon points="60,0 68,2.5 60,5" fill="#c0c0c0" opacity="0.4"/>
    <rect x="-4" y="-0.5" width="8" height="6" rx="1" fill="#c8832c" opacity="0.4"/>
  </g>

  <!-- === TEXT === -->
  <rect x="50" y="375" width="100" height="3" rx="1.5" fill="url(#gold2)"/>
  <text x="50" y="345" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">ENGENHARIA CIVIL</text>

  <text fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="50" y="145">Orçamento</tspan>
    <tspan x="50" dy="44">Preliminar de</tspan>
    <tspan x="50" dy="44">Obras Civis</tspan>
  </text>

  <circle cx="550" cy="220" r="180" fill="#e6a84f" opacity="0.03"/>
</svg>
