<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0f2d6b"/>
      <stop offset="100%" stop-color="#091a3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#e6a84f"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0d1f42"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="450"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5" fill="none" clip-path="url(#clip)">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="40" y1="0" x2="40" y2="450"/><line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="120" y1="0" x2="120" y2="450"/><line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="520" y1="0" x2="520" y2="450"/><line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="680" y1="0" x2="680" y2="450"/><line x1="720" y1="0" x2="720" y2="450"/>
    <line x1="760" y1="0" x2="760" y2="450"/>
  </g>

  <!-- === DESK SURFACE === -->
  <rect x="380" y="300" width="420" height="150" rx="6" fill="url(#desk)" opacity="0.5"/>

  <!-- === BLUEPRINT PAPER (on desk, angled) === -->
  <g transform="translate(440, 120) rotate(3)">
    <!-- Paper -->
    <rect x="0" y="0" width="280" height="220" rx="3" fill="#14335f" stroke="#2a5a9e" stroke-width="1"/>
    <!-- Grid on blueprint -->
    <g opacity="0.12" stroke="#5a9fd4" stroke-width="0.5">
      <line x1="20" y1="0" x2="20" y2="220"/><line x1="60" y1="0" x2="60" y2="220"/>
      <line x1="100" y1="0" x2="100" y2="220"/><line x1="140" y1="0" x2="140" y2="220"/>
      <line x1="180" y1="0" x2="180" y2="220"/><line x1="220" y1="0" x2="220" y2="220"/>
      <line x1="260" y1="0" x2="260" y2="220"/>
      <line x1="0" y1="20" x2="280" y2="20"/><line x1="0" y1="60" x2="280" y2="60"/>
      <line x1="0" y1="100" x2="280" y2="100"/><line x1="0" y1="140" x2="280" y2="140"/>
      <line x1="0" y1="180" x2="280" y2="180"/>
    </g>
    <!-- Floor plan drawing -->
    <g stroke="#5ab8f5" stroke-width="1.5" fill="none" opacity="0.7">
      <rect x="30" y="30" width="220" height="160" rx="1"/>
      <line x1="120" y1="30" x2="120" y2="190"/>
      <line x1="30" y1="110" x2="120" y2="110"/>
      <line x1="120" y1="80" x2="250" y2="80"/>
      <line x1="190" y1="80" x2="190" y2="190"/>
      <!-- Door arcs -->
      <path d="M 120 170 A 20 20 0 0 1 140 190" stroke-width="1" opacity="0.5"/>
      <path d="M 60 110 A 18 18 0 0 0 78 128" stroke-width="1" opacity="0.5"/>
      <!-- Window indicators -->
      <line x1="30" y1="55" x2="30" y2="85" stroke-width="3" opacity="0.3"/>
      <line x1="155" y1="30" x2="185" y2="30" stroke-width="3" opacity="0.3"/>
    </g>
    <!-- Dimension lines -->
    <g stroke="#c8832c" stroke-width="0.8" opacity="0.5">
      <line x1="30" y1="205" x2="120" y2="205"/>
      <line x1="30" y1="200" x2="30" y2="210"/>
      <line x1="120" y1="200" x2="120" y2="210"/>
      <text x="75" y="218" fill="#c8832c" text-anchor="middle" font-size="9" font-family="monospace">4.00m</text>
      <line x1="120" y1="205" x2="250" y2="205"/>
      <line x1="250" y1="200" x2="250" y2="210"/>
      <text x="185" y="218" fill="#c8832c" text-anchor="middle" font-size="9" font-family="monospace">6.50m</text>
    </g>
  </g>

  <!-- === PERSON (silhouette looking at blueprint) === -->
  <g transform="translate(480, 80)">
    <!-- Head -->
    <circle cx="0" cy="0" r="22" fill="#d4a06a" opacity="0.85"/>
    <!-- Hair -->
    <path d="M -22 -5 Q -22 -25 0 -25 Q 22 -25 22 -5" fill="#3a2a1a" opacity="0.8"/>
    <!-- Hard hat -->
    <path d="M -26 -8 Q -26 -32 0 -32 Q 26 -32 26 -8 L 28 -6 L -28 -6 Z" fill="#c8832c" opacity="0.9"/>
    <rect x="-28" y="-8" width="56" height="5" rx="2" fill="#e6a84f" opacity="0.85"/>
    <!-- Body -->
    <path d="M -16 20 Q -20 50 -24 100 L 24 100 Q 20 50 16 20 Z" fill="#1a3a6e" opacity="0.9"/>
    <!-- Collar -->
    <path d="M -8 20 L 0 30 L 8 20" fill="#2a5a9e" opacity="0.7"/>
    <!-- Arm reaching toward blueprint -->
    <path d="M 16 40 Q 35 45 55 55 Q 60 57 58 50 Q 50 35 30 32" fill="#1a3a6e" opacity="0.85" stroke="#0f2d6b" stroke-width="0.5"/>
    <!-- Hand -->
    <circle cx="58" cy="52" r="6" fill="#d4a06a" opacity="0.8"/>
  </g>

  <!-- === COMPASS (in person's other hand) === -->
  <g transform="translate(430, 200)">
    <!-- Compass body -->
    <line x1="0" y1="0" x2="-18" y2="50" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="50" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
    <!-- Hinge -->
    <circle cx="0" cy="0" r="5" fill="#d4d4d4" stroke="#999" stroke-width="1"/>
    <!-- Pencil tip -->
    <circle cx="18" cy="50" r="2" fill="#c8832c"/>
    <!-- Needle tip -->
    <circle cx="-18" cy="50" r="1.5" fill="#888"/>
    <!-- Drawn arc -->
    <path d="M 18 50 A 26 26 0 0 1 -5 54" stroke="#c8832c" stroke-width="1" fill="none" stroke-dasharray="3,2" opacity="0.6"/>
  </g>

  <!-- === RULER (lying on desk) === -->
  <g transform="translate(560, 320) rotate(-12)">
    <rect x="0" y="0" width="160" height="20" rx="2" fill="#e6a84f" opacity="0.6"/>
    <g stroke="#0c2456" stroke-width="0.5" opacity="0.5">
      <line x1="10" y1="0" x2="10" y2="8"/><line x1="20" y1="0" x2="20" y2="12"/>
      <line x1="30" y1="0" x2="30" y2="8"/><line x1="40" y1="0" x2="40" y2="12"/>
      <line x1="50" y1="0" x2="50" y2="8"/><line x1="60" y1="0" x2="60" y2="12"/>
      <line x1="70" y1="0" x2="70" y2="8"/><line x1="80" y1="0" x2="80" y2="12"/>
      <line x1="90" y1="0" x2="90" y2="8"/><line x1="100" y1="0" x2="100" y2="12"/>
      <line x1="110" y1="0" x2="110" y2="8"/><line x1="120" y1="0" x2="120" y2="12"/>
      <line x1="130" y1="0" x2="130" y2="8"/><line x1="140" y1="0" x2="140" y2="12"/>
      <line x1="150" y1="0" x2="150" y2="8"/>
    </g>
  </g>

  <!-- === PENCIL (lying on desk) === -->
  <g transform="translate(650, 350) rotate(25)">
    <rect x="0" y="0" width="70" height="7" rx="1" fill="#e6c84f" opacity="0.5"/>
    <polygon points="70,0 80,3.5 70,7" fill="#d4a06a" opacity="0.5"/>
    <circle cx="80" cy="3.5" r="1" fill="#333" opacity="0.4"/>
  </g>

  <!-- === TEXT === -->
  <!-- Golden accent line -->
  <rect x="50" y="375" width="100" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Tag -->
  <text x="50" y="345" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="0.12em">ENGENHARIA CIVIL</text>

  <!-- Title -->
  <text fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">
    <tspan x="50" y="145">Leitura e</tspan>
    <tspan x="50" dy="44">Interpretação</tspan>
    <tspan x="50" dy="44">de Projetos</tspan>
  </text>

  <!-- Subtle glow -->
  <circle cx="500" cy="200" r="200" fill="#5ab8f5" opacity="0.03"/>
</svg>
