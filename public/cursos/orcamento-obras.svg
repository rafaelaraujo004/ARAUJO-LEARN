<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2456"/>
      <stop offset="100%" stop-color="#1a3d6e"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#e6a84f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <g opacity="0.04" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- Bar chart -->
  <g transform="translate(440, 60)" opacity="0.18">
    <rect x="0" y="200" width="50" height="100" rx="3" fill="#fff"/>
    <rect x="70" y="140" width="50" height="160" rx="3" fill="#fff"/>
    <rect x="140" y="80" width="50" height="220" rx="3" fill="#c8832c"/>
    <rect x="210" y="160" width="50" height="140" rx="3" fill="#fff"/>
    <rect x="280" y="120" width="50" height="180" rx="3" fill="#fff"/>
    <polyline points="25,180 95,120 165,60 235,140 305,100" stroke="#e6a84f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-10" y1="300" x2="340" y2="300" stroke="#fff" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Calculator icon -->
  <g transform="translate(60, 95)" fill="none" stroke="#c8832c" stroke-width="1.5" stroke-linecap="round">
    <rect x="0" y="0" width="30" height="36" rx="3"/>
    <rect x="4" y="4" width="22" height="8" rx="1" fill="#c8832c" opacity="0.3"/>
    <circle cx="9" cy="18" r="1.5" fill="#c8832c"/>
    <circle cx="15" cy="18" r="1.5" fill="#c8832c"/>
    <circle cx="21" cy="18" r="1.5" fill="#c8832c"/>
    <circle cx="9" cy="25" r="1.5" fill="#c8832c"/>
    <circle cx="15" cy="25" r="1.5" fill="#c8832c"/>
    <rect x="18" y="23" width="6" height="5" rx="1" fill="#c8832c" opacity="0.3"/>
    <circle cx="9" cy="32" r="1.5" fill="#c8832c"/>
    <circle cx="15" cy="32" r="1.5" fill="#c8832c"/>
  </g>
  <!-- Golden accent line -->
  <rect x="60" y="380" width="120" height="4" rx="2" fill="url(#gold2)"/>
  <!-- Title -->
  <text x="60" y="190" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="60" dy="0">Orçamento</tspan>
    <tspan x="60" dy="46">Preliminar de</tspan>
    <tspan x="60" dy="46">Obras Civis</tspan>
  </text>
  <text x="60" y="345" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="0.1em">ENGENHARIA CIVIL</text>
</svg>
