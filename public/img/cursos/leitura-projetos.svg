<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2456"/>
      <stop offset="100%" stop-color="#163a7a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#e6a84f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="40" y1="0" x2="40" y2="450"/><line x1="80" y1="0" x2="80" y2="450"/>
    <line x1="120" y1="0" x2="120" y2="450"/><line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="520" y1="0" x2="520" y2="450"/><line x1="560" y1="0" x2="560" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="680" y1="0" x2="680" y2="450"/><line x1="720" y1="0" x2="720" y2="450"/>
    <line x1="760" y1="0" x2="760" y2="450"/>
  </g>
  <!-- Blueprint floor plan -->
  <g transform="translate(420, 60)" opacity="0.15" stroke="#fff" stroke-width="2" fill="none">
    <rect x="0" y="0" width="300" height="300" rx="2"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="0" y1="150" x2="120" y2="150"/>
    <line x1="120" y1="100" x2="300" y2="100"/>
    <line x1="200" y1="100" x2="200" y2="300"/>
    <rect x="15" y="15" width="90" height="120" rx="1" stroke-dasharray="4,4"/>
    <rect x="135" y="115" width="50" height="55" rx="1" stroke-dasharray="4,4"/>
    <path d="M 120 260 A 30 30 0 0 1 150 290"/>
    <path d="M 50 150 A 25 25 0 0 0 75 175"/>
    <line x1="0" y1="330" x2="120" y2="330" stroke-dasharray="2,2" opacity="0.5"/>
    <line x1="120" y1="330" x2="300" y2="330" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="60" y="348" fill="#fff" text-anchor="middle" font-size="11" opacity="0.5" font-family="monospace">4.00</text>
    <text x="210" y="348" fill="#fff" text-anchor="middle" font-size="11" opacity="0.5" font-family="monospace">6.00</text>
  </g>
  <!-- Ruler icon -->
  <g transform="translate(60, 100)" fill="none" stroke="#c8832c" stroke-width="1.5" stroke-linecap="round">
    <path d="M 0 20 L 20 0 L 40 20"/>
    <line x1="10" y1="10" x2="13" y2="13"/>
    <line x1="20" y1="0" x2="20" y2="5"/>
    <line x1="30" y1="10" x2="27" y2="13"/>
  </g>
  <!-- Golden accent line -->
  <rect x="60" y="380" width="120" height="4" rx="2" fill="url(#gold)"/>
  <!-- Title -->
  <text x="60" y="190" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em">
    <tspan x="60" dy="0">Leitura e</tspan>
    <tspan x="60" dy="46">Interpretação</tspan>
    <tspan x="60" dy="46">de Projetos</tspan>
  </text>
  <text x="60" y="345" fill="#c8832c" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="0.1em">ENGENHARIA CIVIL</text>
